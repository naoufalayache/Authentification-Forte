spring.application.name=authentication

# Base H2 uniquement pour les tests
spring.datasource.url=jdbc:postgresql://localhost:5432/authentication_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA
spring.jpa.hibernate.ddl-auto=validate

# Flyway
logging.level.org.flywaydb=DEBUG
spring.flyway.locations=classpath:db/migrations
spring.flyway.baseline-on-migrate=true

# Valeurs factices pour les tests
spring.application.secretKey=testSecretKeyForAutomatedTests12345678901234567890
jwt.token.expiresIn=15